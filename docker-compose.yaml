version: '3.8'

networks:
  cbt_public:
    driver: bridge
  cbt_internal:
    driver: bridge
    internal: true

services:
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "4321:80"
    networks:
      - cbt_public
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:8000/simulations
    volumes:
      - ./frontend/src:/app
      - /app/node_modules

  backend:
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # <-- Esperamos a que el healthcheck pase
    networks:
      - cbt_public
      - cbt_internal
    env_file:
      - ./backend/src/.env
    volumes:
      - ./backend/src:/app/app
      - backend_storage:/app/storage

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cbt_db_migrations
    ports:
      - "5432:5432"
    networks:
      - cbt_internal
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # --- NUEVO BLOQUE: Comprobación de salud ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backend_storage: